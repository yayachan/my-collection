<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的收藏小宇宙</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf5ec;color:#634c3c;font:16px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:20px}header{padding:24px 0}h1{font-size:30px;margin:0}small{color:#90765f}button,input,select,textarea{font:inherit;border:1px solid #dfcdb8;border-radius:12px;padding:11px;background:#fffdf8;color:inherit}button{cursor:pointer}button.primary{background:#967457;color:white;border:0}button:focus-visible{outline:3px solid #c99b70}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.bar input{flex:1;min-width:150px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stats div{background:#efe2d1;border-radius:16px;padding:16px;text-align:center}.stats b{display:block;font-size:25px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.item{background:#fffdf8;border:1px solid #e9dac8;border-radius:18px;overflow:hidden}.photo{width:100%;aspect-ratio:1;object-fit:contain;background:#f0e5d6;display:grid;place-items:center;font-size:48px}.info{padding:12px;overflow-wrap:anywhere}.info h3{margin:6px 0;font-size:16px}.tag{font-size:12px;background:#efe2d1;padding:4px 8px;border-radius:20px;display:inline-block}.info p{font-size:13px;margin:6px 0}.info button{font-size:13px;padding:7px}dialog{border:1px solid #dfcdb8;border-radius:20px;background:#faf5ec;color:inherit;width:min(94vw,540px);max-height:90dvh;overflow:auto}dialog::backdrop{background:#48352688}form label{display:grid;gap:5px;margin:10px 0;font-size:14px}form input,form select,form textarea{width:100%;min-width:0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}#preview{max-height:150px;max-width:100%;border-radius:12px}#empty{text-align:center;padding:48px 10px;color:#90765f}footer{font-size:13px;margin-top:30px;line-height:1.7}#notice{color:#935329;white-space:pre-wrap} @media(max-width:400px){main{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats div{padding:10px 4px}}
</style><meta name="theme-color" content="#967457"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"></head><body><main><header><small>MY LITTLE COLLECTION ♡</small><h1>我的收藏小宇宙</h1><p>把喜歡的事物，好好收藏。</p></header><div class="stats" id="stats"></div><div class="bar"><button class="primary" id="add">＋ 新增收藏</button><button id="newcat">＋ 分類</button><button id="export">備份 JSON</button><button id="csv">匯出 CSV</button><button id="import">匯入備份</button><input type="file" id="backup" accept=".json,application/json" hidden></div><div class="bar"><input id="search" placeholder="搜尋名稱、角色、系列、關鍵字…"><select id="filter"></select><select id="statusfilter"><option>全部狀態</option><option>已收藏</option><option>願望清單</option><option>預購中</option></select></div><p id="notice" role="status"></p><div id="grid" class="grid"></div><div id="empty">♡ 還沒有符合的收藏，新增第一件吧！</div><footer>資料保存在目前瀏覽器，清除網站資料可能遺失收藏。請定期備份 JSON（含照片）；CSV 不含照片。不同裝置不會自動同步。</footer></main><dialog id="modal"><form id="form"><h2 id="heading">新增收藏</h2><label>收藏照片<input type="file" id="pic" accept="image/*"></label><img id="preview" hidden alt="收藏照片預覽"><button type="button" id="removePic">移除照片</button><label>商品名稱 *<input id="name" required maxlength="200"></label><div class="pair"><label>IP／分類<select id="category"></select></label><label>角色<input id="character"></label></div><div class="pair"><label>系列<input id="series"></label><label>商品類型<input id="type" placeholder="吊飾、娃娃、漫畫…"></label></div><div class="pair"><label>狀態<select id="status"><option>已收藏</option><option>願望清單</option><option>預購中</option></select></label><label>數量<input id="qty" type="number" min="1" step="1" value="1" required></label></div><div class="pair"><label>單件購入價格<input id="price" type="number" min="0" step="0.01"></label><label>幣別<select id="currency"><option>TWD</option><option>JPY</option></select></label></div><div class="pair"><label>購入日期<input id="date" type="date"></label><label>購入地點<input id="place"></label></div><label>關鍵字／備註<textarea id="notes" rows="2"></textarea></label><p id="duplicate" role="status"></p><div class="bar"><button class="primary" id="save">儲存收藏</button><button type="button" id="cancel">取消</button></div></form></dialog><script>
const $=id=>document.getElementById(id), defaults=['吉伊卡哇','寶可夢','貓貓蟲咖波','偶像周邊（ARASHI、Hey! Say! JUMP）','動漫周邊','吉卜力','其他收藏','漫畫','小說','書籍'];let items=[],cats=[...defaults],db,editing=null,photo='',busy=false;const fields=['name','category','character','series','type','status','qty','price','currency','date','place','notes'];const norm=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/\s/g,'');function msg(s){$('notice').textContent=s}function persist(next=items,nextCats=cats){return new Promise((resolve,reject)=>{let t=db.transaction('data','readwrite');t.objectStore('data').put({items:next,cats:nextCats},'collection');t.oncomplete=()=>{items=next;cats=nextCats;resolve()};t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}function options(){for(let id of ['category','filter']){let el=$(id),old=el.value;el.replaceChildren();for(let c of (id==='filter'?['全部分類',...cats]:cats))el.add(new Option(c,c));if([...el.options].some(o=>o.value===old))el.value=old}}function node(tag,text,cls){let n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}function render(){let stats=$('stats');stats.replaceChildren();for(let s of ['已收藏','願望清單','預購中']){let d=node('div');d.append(node('b',items.filter(x=>x.status===s).reduce((a,x)=>a+Number(x.qty),0)),node('span',s));stats.append(d)}let q=norm($('search').value),c=$('filter').value,s=$('statusfilter').value;let list=items.filter(x=>(c==='全部分類'||x.category===c)&&(s==='全部狀態'||x.status===s)&&norm(fields.map(k=>x[k]).join(' ')).includes(q));$('grid').replaceChildren();$('empty').hidden=!!list.length;for(let x of list){let card=node('article',undefined,'item');if(x.photo){let im=node('img',undefined,'photo');im.src=x.photo;im.alt=x.name;card.append(im)}else card.append(node('div','🧸','photo'));let d=node('div',undefined,'info');d.append(node('span',x.status,'tag'),node('h3',x.name),node('p',[x.category,x.character,x.series,x.type].filter(Boolean).join(' · ')),node('p','數量 '+x.qty+(x.price!==''?' · '+x.currency+' '+x.price+'/件':'')),node('p',[x.date,x.place,x.notes].filter(Boolean).join(' · ')));let e=node('button','編輯'),del=node('button','刪除');e.onclick=()=>openForm(x);del.onclick=async()=>{if(confirm('確定刪除 '+x.name+'？'))try{await persist(items.filter(y=>y.id!==x.id));render()}catch{msg('刪除失敗')}};d.append(e,del);card.append(d);$('grid').append(card)}}function preview(){ $('preview').hidden=!photo;if(photo)$('preview').src=photo;else $('preview').removeAttribute('src')}function duplicates(){let n=norm($('name').value);return items.filter(x=>x.id!==editing&&n&&(norm(x.name)===n||(n.length>=3&&(norm(x.name).includes(n)||n.includes(norm(x.name))))))}function warn(){let d=duplicates();$('duplicate').textContent=d.length?'⚠ 可能重複：'+d.map(x=>x.name+'（'+x.status+'）').join('、'):'';return d}function openForm(x){$('form').reset();editing=x?.id||null;photo=x?.photo||'';if(x)for(let k of fields)$(k).value=x[k]??'';$('heading').textContent=x?'編輯收藏':'新增收藏';preview();warn();$('modal').showModal()}$('name').oninput=warn;$('add').onclick=()=>openForm();$('cancel').onclick=()=>$('modal').close();$('removePic').onclick=()=>{photo='';$('pic').value='';preview()};$('pic').onchange=async()=>{let f=$('pic').files[0];if(!f)return;busy=true;$('save').disabled=true;try{let im=new Image(),url=URL.createObjectURL(f);try{im.src=url;await im.decode();let scale=Math.min(1,900/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.width*scale));cv.height=Math.max(1,Math.round(im.height*scale));let ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(im,0,0,cv.width,cv.height);photo=cv.toDataURL('image/jpeg',.8);preview()}finally{URL.revokeObjectURL(url)}}catch{alert('無法讀取照片，請試 JPG 或 PNG。')}finally{busy=false;$('save').disabled=false}};$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;if(!$('name').value.trim())return;if(warn().length&&!confirm('可能已經有同款收藏，仍要儲存嗎？'))return;let x={id:editing||crypto.randomUUID?.()||Date.now().toString(),photo};for(let k of fields)x[k]=$(k).value.trim();x.qty=Number(x.qty);try{await persist(editing?items.map(y=>y.id===editing?x:y):[x,...items]);$('modal').close();render();msg('已儲存 ♡')}catch{alert('儲存失敗，可能是空間不足。請先備份。')}};$('newcat').onclick=async()=>{let c=prompt('新分類名稱')?.trim();if(c&&!cats.includes(c))try{await persist(items,[...cats,c]);options();render()}catch{msg('新增分類失敗')}};for(let id of ['search','filter','statusfilter'])$(id).oninput=render;function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=node('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}$('export').onclick=()=>download('收藏備份.json',JSON.stringify({version:1,items,cats}),'application/json');$('csv').onclick=()=>{let quote=v=>'"'+String(v??'').replace(/^[=+\-@\t\r]/,"'$&").replaceAll('"','""')+'"';download('收藏清單.csv','\ufeff'+[['商品名稱','分類','角色','系列','類型','狀態','數量','單價','幣別','日期','地點','備註'],...items.map(x=>fields.map(k=>x[k]))].map(r=>r.map(quote).join(',')).join('\r\n'),'text/csv;charset=utf-8')};$('import').onclick=()=>$('backup').click();$('backup').onchange=async()=>{try{let f=$('backup').files[0];if(!f)return;let d=JSON.parse(await f.text());if(d.version!==1||!Array.isArray(d.items)||!Array.isArray(d.cats)||!d.cats.every(c=>typeof c==='string')||!d.items.every(x=>x&&typeof x.id==='string'&&fields.every(k=>k==='qty'?Number.isInteger(x[k])&&x[k]>0:typeof x[k]==='string')&&['已收藏','願望清單','預購中'].includes(x.status)&&typeof x.photo==='string'&&(!x.photo||/^data:image\/jpeg;base64,/.test(x.photo)))||new Set(d.items.map(x=>x.id)).size!==d.items.length)throw Error();if(confirm('匯入會取代目前所有收藏。請先備份現有資料。確定匯入？')){await persist(d.items,[...new Set([...defaults,...d.cats,...d.items.map(x=>x.category)])]);options();render();msg('備份已匯入')}}catch{msg('匯入失敗：檔案格式不符或儲存空間不足')}finally{$('backup').value=''}};let req=indexedDB.open('little-collection-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('data');req.onsuccess=()=>{db=req.result;let r=db.transaction('data').objectStore('data').get('collection');r.onsuccess=()=>{if(r.result){items=r.result.items;cats=r.result.cats}options();render()};r.onerror=()=>msg('無法讀取收藏資料')};req.onerror=()=>msg('此瀏覽器無法使用本地儲存，請改用一般瀏覽器開啟。');options();render();
</script><script>
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(console.error);
</script></body></html>
